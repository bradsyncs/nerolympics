<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>Nerolympics | Staff Control Center</title>
<style>
[hidden]{display:none!important}:root{color-scheme:dark;--bg:#080b12;--panel:#111827;--panel2:#151f30;--line:#263449;--muted:#91a0b7;--text:#f4f7fc;--accent:#b69aff;--red:#ff6b78;--green:#6ee7b7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#291747 0,#080711 52%);color:var(--text);font:15px/1.5 Inter,system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;scroll-margin:0}button:focus{outline-offset:2px}button{cursor:pointer;border:1px solid #50366f;background:#302044;color:#fff;border-radius:10px;padding:10px 14px;font-weight:650}button:hover{filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#8b5cf6;color:#fff;border-color:#a78bfa}.danger{background:#49232b;border-color:#7e3947}.secondary{background:#182336}.small{padding:6px 9px;font-size:12px}.muted,small{color:var(--muted)}input,select,textarea{width:100%;background:#100c18;border:1px solid #49336d;color:var(--text);border-radius:9px;padding:10px 11px;min-width:0}textarea{min-height:90px;resize:vertical}label{display:block;font-size:12px;color:#aebbd0;margin:10px 0 5px}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(100%,420px);padding:30px;border:1px solid var(--line);background:#171020;border-radius:20px;box-shadow:0 25px 80px #0008}.loginbox h1{margin:0 0 5px;font-size:27px}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{padding:22px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,#120d1d,#0d0a14);position:sticky;top:0;height:100vh;overflow:auto;z-index:70}.brand{padding:4px 10px 22px;font-size:17px;font-weight:850;letter-spacing:.08em}.brand span{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.2em}.nav{display:grid;gap:16px}.nav-group{display:grid;gap:4px}.nav-label{padding:0 11px 5px;color:#8f7caf;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.nav button{text-align:left;display:flex;align-items:center;gap:10px;background:transparent;border-color:transparent;color:#b7c4d8;padding:10px 12px;border-radius:10px;transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s ease}.nav button:before{content:"";width:6px;height:6px;border-radius:50%;background:#65517f;opacity:.75;transition:all .2s ease}.nav button:hover{background:#21172e;color:#fff;transform:translateX(3px)}.nav button.active{background:linear-gradient(100deg,#392451,#241832);border-color:#7654b8;color:#fff;box-shadow:inset 3px 0 #b69aff,0 6px 18px #0003}.nav button.active:before{background:#c6aaff;box-shadow:0 0 10px #b69aff;opacity:1}.sidebarfoot{margin-top:22px;padding:10px;border-top:1px solid #2a2038}.main{padding:26px;max-width:1500px;width:100%;margin:auto}.menu-toggle{display:none}.nav-scrim{display:none}.page.active{animation:pageIn .28s ease both}@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.top-start{display:flex;align-items:center;gap:12px}.top h1{margin:0;font-size:28px}.top-actions{display:flex;gap:8px;align-items:center}.role{border:1px solid var(--line);border-radius:99px;padding:6px 11px;color:var(--accent);font-size:12px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.panel{background:linear-gradient(145deg,#211632,#100d1b);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:14px}.stat strong{display:block;font-size:28px;margin-top:6px}.stat span{font-size:11px;letter-spacing:.13em;color:var(--muted)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:0 1 auto}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 12px}.formgrid .wide{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #233147;font-size:13px}th{color:#91a0b7;font-size:10px;letter-spacing:.12em;background:#1b1328}tr:last-child td{border-bottom:0}.pill{display:inline-block;border:1px solid #49336d;border-radius:99px;padding:3px 8px;font-size:11px;color:#c9d8ec}.notice{padding:13px;border:1px solid #49336d;border-radius:10px;background:#1b1328;color:#c7d7eb}.item{padding:12px 0;border-bottom:1px solid #243247}.item:last-child{border:0}.itemhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.checkbox{width:auto}.dangertext{color:var(--red)}.success{color:var(--green)}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.searchbar{max-width:460px}.permission{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:10px 0;border-bottom:1px solid #263449}.permission input{width:auto}.toast{position:fixed;right:18px;bottom:18px;background:#8b5cf6;color:#fff;padding:12px 16px;border-radius:11px;box-shadow:0 10px 35px #0009;display:none;z-index:99}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:18px;z-index:80}.modalbox{max-width:620px;width:100%;max-height:85vh;overflow:auto;background:#171020;border:1px solid #62458f;border-radius:17px;padding:20px}.modalbox pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#cbd8ea}.empty{color:var(--muted);padding:18px;text-align:center}@media(max-width:850px){.layout{display:block}.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(84vw,330px);height:100dvh;padding:22px 14px;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:18px 0 50px #0008;overflow-y:auto}.menu-open .sidebar{transform:translateX(0)}.nav-scrim{display:block;position:fixed;inset:0;background:#05030acc;backdrop-filter:blur(4px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s ease}.menu-open .nav-scrim{opacity:1;pointer-events:auto}.brand{padding:5px 8px 22px}.nav{display:grid;overflow:visible}.nav button{white-space:normal}.sidebarfoot{position:static;margin-top:20px}.main{padding:16px}.top{align-items:center;flex-wrap:wrap}.top-start{min-width:0}.menu-toggle{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;font-size:20px;background:#21172e;border:1px solid #594078}.top h1{font-size:24px}.split{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
.maintenance-wrap{display:grid;gap:14px;max-width:900px}.maintenance-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;padding:24px;border:1px solid #7654b8;border-radius:18px;background:radial-gradient(ellipse at 15% 0%,#7543b5 0%,transparent 55%),linear-gradient(125deg,#302044,#171020 70%);box-shadow:0 18px 55px #4c1d9550}.maintenance-hero:after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-110px;border-radius:50%;border:1px solid #c4a5ff35;box-shadow:0 0 0 22px #c4a5ff0b,0 0 0 46px #c4a5ff08}.maintenance-orb{display:grid;place-items:center;flex:0 0 54px;height:54px;border-radius:17px;background:linear-gradient(145deg,#b794ff,#7540d5);font-size:27px;box-shadow:0 8px 28px #8b5cf677}.maintenance-kicker{font-size:10px;font-weight:850;letter-spacing:.22em;color:#d2baff}.maintenance-hero h2{margin:3px 0;font-size:25px}.maintenance-hero p{margin:0;color:#c6b8d9}.maintenance-pill{position:relative;z-index:1;margin-left:auto;padding:7px 10px;border:1px solid #a78bfa66;border-radius:99px;background:#170e28;color:#e4d7ff;font-size:10px;font-weight:800;white-space:nowrap}.maintenance-panel{padding:21px;border:1px solid #594078;border-radius:16px;background:linear-gradient(145deg,#211632,#100d1b);box-shadow:0 12px 35px #0003}.maintenance-toggle-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:17px;margin-bottom:15px;border-bottom:1px solid #3b2b50}.maintenance-toggle-row b,.maintenance-toggle-row small{display:block}.maintenance-toggle-row small{margin-top:3px}.switch{position:relative;display:inline-flex;width:54px;height:30px;margin:0;flex-shrink:0}.switch input{position:absolute;opacity:0;width:1px;height:1px}.switch-track{position:absolute;inset:0;border-radius:99px;background:#40364d;border:1px solid #715b8c;transition:.2s}.switch-track:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#eee5ff;box-shadow:0 2px 8px #0006;transition:.2s}.switch input:checked+.switch-track{background:#8b5cf6;border-color:#c4a5ff;box-shadow:0 0 18px #8b5cf655}.switch input:checked+.switch-track:before{transform:translateX(24px);background:#fff}.maintenance-panel textarea{min-height:115px;background:#100b19;border-color:#64478a}.maintenance-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}.maintenance-status{font-size:12px;color:#b9a8d2}.maintenance-status.success{color:#6ee7b7}.maintenance-status.error{color:#ff8994}.maintenance-tip{padding:12px 15px;border:1px solid #49336d;border-radius:11px;background:#1b1328;color:#cdb9ef;font-size:12px}@media(max-width:600px){.maintenance-hero{align-items:flex-start;flex-wrap:wrap;padding:18px}.maintenance-pill{margin-left:0}.maintenance-hero h2{font-size:21px}.maintenance-footer{align-items:stretch}.maintenance-footer button{width:100%}}
</style>
</head>
<body>
<section class="login" id="loginScreen">
  <div class="loginbox">
    <h1>NEROLYMPICS</h1>
    <p class="muted">Staff Control Center</p>
    <p class="muted">Sign in using your authorized Discord account.</p>
    <div class="toolbar">
      <button class="primary" type="button" id="discordLoginButton">Continue with Discord</button>
    </div>
    <p class="muted" id="loginError"></p>
  </div>
</section>
<div class="layout hidden" id="dashboard"><div class="nav-scrim" id="navScrim"></div><aside class="sidebar"><div class="brand">NERO<span>OLYMPICS CONTROL CENTER</span></div><nav class="nav" id="nav"></nav><div class="sidebarfoot"><div class="muted" id="roleLabel"></div><button class="secondary small" id="logoutButton">Sign Out</button></div></aside><main class="main"><header class="top"><div class="top-start"><button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">☰</button><div><h1 id="pageTitle">Overview</h1><small id="lastUpdated">Event management system</small></div></div><div class="top-actions"><span class="role" id="rolePill">Discord User</span><button class="secondary" id="refreshButton">Refresh</button></div></header><div id="pages"></div></main></div>
<div class="toast" id="toast"></div><div class="modal hidden" id="modal"><div class="modalbox"><div class="itemhead"><h2 id="modalTitle">Confirm</h2><button class="secondary small" id="modalClose">Close</button></div><div id="modalBody"></div><div class="toolbar" id="modalActions"></div></div></div>
<script>
const $=id=>document.getElementById(id);let state=null,role='staff',active='overview',displayName='Discord User';const greetings=['Hello','Greetings','Welcome','A pleasure to have you here','Good to see you','Welcome back','Great to have you here','Hope you are doing well'];const greeting=()=>`${greetings[Math.floor(Math.random()*greetings.length)]}, ${esc(displayName)}!`;const navItems=[['overview','Overview'],['players','Participants'],['teams','Teams'],['events','Events & Matches'],['checkin','Check-ins'],['scoring','Scoring & Challenges'],['announcements','Announcements'],['awards','MVP & Prizes'],['halloffame','Hall of Fame'],['analytics','Analytics'],['search','Global Search'],['recycle','Recycle Bin'],['history','Version History'],['activity','Activity Log'],['backups','Backups'],['permissions','Staff Permissions'],['maintenance','Maintenance Mode'],['display','Display Settings']];const navGroups=[['OVERVIEW',[['overview','Overview'],['players','Participants'],['teams','Teams']]],['EVENT MANAGEMENT',[['events','Events & Matches'],['checkin','Check-ins'],['scoring','Scoring & Challenges'],['announcements','Announcements'],['awards','MVP & Prizes'],['halloffame','Hall of Fame']]],['REPORTS & RECORDS',[['analytics','Analytics'],['search','Global Search'],['recycle','Recycle Bin'],['history','Version History'],['activity','Activity Log'],['backups','Backups']]],['ADMINISTRATION',[['permissions','Staff Permissions'],['maintenance','Maintenance Mode'],['display','Display Settings']]]];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString();function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2800)}
async function api(url,options={}){const r=await fetch(url,{cache:'no-store',credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
let actionInFlight=false;async function action(type,payload={}){if(actionInFlight){toast('Please wait for the current save to finish.');return false;}actionInFlight=true;const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.dataset.wasDisabled=b.disabled?'1':'0');try{const result=await api('/api/staff/action',{method:'POST',body:JSON.stringify({type,payload})});await loadState();toast('Saved successfully.');return result;}catch(error){toast(error.message||'Could not save. Please try again.');return false;}finally{actionInFlight=false;document.querySelectorAll('button[data-was-disabled]').forEach(b=>{if(b.dataset.wasDisabled==='0')b.disabled=false;delete b.dataset.wasDisabled;});}}
function page(id,title,html){return `<section class="page ${active===id?'active':''}" id="page-${id}">${html}</section>`}function field(label,id,placeholder='',type='text'){return `<label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}">`}function select(label,id,options){return `<label>${label}</label><select id="${id}">${options}</select>`}function btn(id,label,cls=''){return `<button type="button" id="${id}" class="${cls}">${label}</button>`}function check(id,label){return `<label><input class="checkbox" type="checkbox" id="${id}"> ${label}</label>`}
function closeNav(){document.body.classList.remove('menu-open');$('menuToggle').setAttribute('aria-expanded','false');$('menuToggle').setAttribute('aria-label','Open navigation')}function renderShell(){ $('nav').innerHTML=navGroups.map(([group,items])=>`<div class="nav-group"><div class="nav-label">${group}</div>${items.map(([id,label])=>`<button type="button" data-page="${id}" class="${active===id?'active':''}">${label}</button>`).join('')}</div>`).join('');$('pages').innerHTML=renderPages();$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('pageTitle').textContent=navItems.find(x=>x[0]===active)?.[1]||'Overview';$('roleLabel').textContent=displayName;$('rolePill').textContent=displayName;}
function renderPages(){return [page('overview', '', overviewHTML()),page('players','',playersHTML()),page('teams','',teamsHTML()),page('events','',eventsHTML()),page('checkin','',checkinHTML()),page('scoring','',scoringHTML()),page('announcements','',announcementsHTML()),page('awards','',awardsHTML()),page('halloffame','',hallOfFameHTML()),page('analytics','',analyticsHTML()),page('search','',searchHTML()),page('recycle','',recycleHTML()),page('history','',historyHTML()),page('activity','',activityHTML()),page('backups','',backupsHTML()),page('permissions','',permissionsHTML()),page('maintenance','',maintenanceHTML()),page('display','',displayHTML())].join('');}
function overviewHTML(){const s=state;return `<div class="panel welcome-panel"><h2>${greeting()}</h2><p class="muted">Welcome to the Nerolympics Control Center.</p></div><div class="grid"><div class="card stat"><span>PARTICIPANTS</span><strong>${s.players.length}</strong></div><div class="card stat"><span>TEAMS</span><strong>${s.teams.length}</strong></div><div class="card stat"><span>EVENTS</span><strong>${s.events.length}</strong></div><div class="card stat"><span>ACTIVE MATCHES</span><strong>${s.matches.filter(x=>x.status!=='Completed').length}</strong></div><div class="card stat"><span>TOTAL POINTS</span><strong>${money(s.players.reduce((n,p)=>n+Number(p.points||0),0))}</strong></div><div class="card stat"><span>RECYCLE BIN</span><strong>${s.recycleBin.length}</strong></div></div><div class="split"><div class="panel"><h2>Event Control Center</h2><p class="muted">Current event status and operational overview.</p><div class="notice">${s.settings.maintenanceMode?'Maintenance mode is ON.':'Public website is live.'}<br>Teams: ${s.settings.teamsPublished?'Published':'Hidden'}<br>Winner: ${s.winner?.published?esc(s.winner.teamName):'Not published'}<br>MVP: ${s.settings.mvp?.published?'Published':'Not published'}</div></div><div class="panel"><h2>Upcoming / Active Events</h2>${s.events.filter(e=>e.status!=='Completed').slice(0,5).map(e=>`<div class="item"><b>${esc(e.title)}</b><div class="muted">${esc(e.status)} · ${date(e.startAt)}</div></div>`).join('')||'<p class="empty">No active events.</p>'}</div></div><div class="panel"><h2>Quick Actions</h2><div class="toolbar">${btn('quickRefresh','Refresh data','secondary')}${btn('quickUndo','Undo latest change','secondary')}${btn('quickSearch','Open global search','secondary')}</div></div>`}
function playersHTML(){return `<div class="panel"><h2>Add Participant</h2><div class="formgrid">${field('Roblox username','newRoblox')}${field('Discord username','newDiscord')}</div><div class="toolbar">${btn('addPlayer','Add Participant','primary')}</div></div><div class="panel"><div class="itemhead"><h2>Participant Database</h2><input class="searchbar" id="playerFilter" placeholder="Filter participants"></div><div class="toolbar"><button id="selectAllPlayers" class="secondary small">Select all</button><button id="bulkStatus" class="secondary small">Change status</button><button id="bulkPoints" class="secondary small">Award points</button><button id="bulkTeam" class="secondary small">Assign team</button><button id="bulkDeletePlayers" class="danger small">Delete selected</button></div><div id="playerTable"></div></div>`}
function teamsHTML(){return `<div class="panel"><h2>Team Generator</h2><div class="formgrid">${field('Players per team','teamSize','5','number')}</div><div class="toolbar">${btn('generateTeams','Create Teams / Reroll Teams','primary')}${btn('publishTeams','Publish teams')}${btn('resetTeams','Reset teams','danger')}</div><div class="notice">Generated teams remain hidden from the public until published.</div></div><div class="panel"><div class="itemhead"><h2>Teams</h2><button id="bulkDeleteTeams" class="danger small">Delete selected teams</button></div><div id="teamList"></div></div>`}
function eventsHTML(){return `<div class="split"><div class="panel"><h2>Create Event</h2>${field('Title','eventTitle') }<label>Description</label><textarea id="eventDescription"></textarea>${field('Start date and time (your local time)','eventStart','','datetime-local')}${select('Status','eventStatus','<option>Upcoming</option><option>Happening Now</option><option>Completed</option>')}<label><input class="checkbox" type="checkbox" id="eventPublished" checked> Publish publicly</label><div class="toolbar">${btn('addEvent','Create Event','primary')}</div></div><div class="panel"><h2>Create Match</h2>${field('Match title','matchTitle')}${select('Event','matchEvent','<option value="">No event selected</option>')}${field('Scheduled time (your local time)','matchTime','','datetime-local')}<label>Teams (select multiple)</label><select id="matchTeams" multiple size="5"></select><div class="toolbar">${btn('addMatch','Create Match','primary')}</div></div></div><div class="panel"><h2>Events</h2><div id="eventList"></div></div><div class="panel"><h2>Matches</h2><div id="matchList"></div></div>`}
function checkinHTML(){return `<div class="panel"><h2>Record Check-ins</h2>${select('Event','checkinEvent','<option value="">Select event</option>')}${select('Status','checkinStatus','<option>Present</option><option>Absent</option><option>Late</option>')}<p class="muted">Select participants below, then apply the same check-in status to all selected participants.</p><div class="toolbar"><button id="selectAllCheckins" class="secondary small">Select all</button>${btn('saveBulkCheckin','Apply check-in','primary')}</div><div id="checkinTable"></div></div>`}
function scoringHTML(){return `<div class="split"><div class="panel"><h2>Award Points</h2>${select('Participant','pointsPlayer','<option value="">Select participant</option>')}${field('Points (negative values allowed)','pointsAmount','10','number')}<div class="toolbar">${btn('awardPoints','Award points','primary')}</div></div><div class="panel"><h2>Add Achievement</h2>${select('Participant','achievementPlayer','<option value="">Select participant</option>')}${field('Achievement name','achievementName')}<div class="toolbar">${btn('addAchievement','Add achievement','primary')}</div></div></div><div class="panel"><h2>Create Challenge</h2>${field('Title','challengeTitle')}<label>Description</label><textarea id="challengeDescription"></textarea><div class="formgrid">${field('Points reward','challengePoints','5','number')}${field('Achievement (optional)','challengeAchievement')}</div>${check('challengePublished','Publish challenge')}<div class="toolbar">${btn('addChallenge','Create challenge','primary')}</div><div id="challengeList"></div></div>`}
function announcementsHTML(){return `<div class="panel"><h2>Create Announcement</h2>${field('Title','announcementTitle')}<label>Message</label><textarea id="announcementBody"></textarea><label><input class="checkbox" type="checkbox" id="announcementPublished" checked> Publish immediately</label><div class="toolbar">${btn('addAnnouncement','Create announcement','primary')}</div></div><div class="panel"><h2>Announcements</h2><div class="toolbar"><button id="bulkPublishAnnouncements" class="secondary small">Publish selected</button><button id="bulkUnpublishAnnouncements" class="secondary small">Unpublish selected</button><button id="bulkDeleteAnnouncements" class="danger small">Delete selected</button></div><div id="announcementList"></div></div><div class="panel"><h2>Winner Announcement</h2>${select('Winning team','winnerTeam','<option value="">Select team</option>')}<label>Announcement message</label><textarea id="winnerMessage">Congratulations to our Nerolympics champions!</textarea><div class="toolbar">${btn('publishWinner','Publish winner','primary')}${btn('clearWinner','Clear winner','danger')}</div><div class="notice">A newly published winner appears as a full-screen announcement when visitors open the public website.</div></div>`}
function awardsHTML(){return `<div class="split"><div class="panel"><h2>Manual MVP Selection</h2>${select('MVP participant','mvpPlayer','<option value="">Select participant</option>')}<label>MVP message</label><textarea id="mvpMessage"></textarea><div class="toolbar">${btn('selectMvp','Save MVP selection','primary')}${btn('publishMvp','Publish MVP')}</div><div id="mvpStatus" class="notice"></div></div><div class="panel"><h2>Add Prize</h2>${select('Participant','prizePlayer','<option value="">Select participant</option>')}${field('Reward','prizeReward')}${check('prizePublic','Show publicly after delivery')}<div class="toolbar">${btn('addPrize','Add prize','primary')}</div></div></div><div class="panel"><h2>Prize Distribution</h2><div class="toolbar"><button id="bulkPrizeDelivered" class="secondary small">Mark selected delivered</button></div><div id="prizeList"></div></div>`}
function hallOfFameHTML(){return `<div class="panel"><h2>Add Hall of Fame Entry</h2><p class="muted">Add a champion, player, or special achievement to the public Hall of Fame.</p>${field('Team or player name','hallName','e.g. Team 1 or Roblox username') }<label>Achievement / description</label><textarea id="hallMessage" placeholder="e.g. Nerolympics Season 1 Champions"></textarea>${field('Date','hallDate','','date')}<div class="toolbar">${btn('addHallEntry','Add to Hall of Fame','primary')}</div><div class="notice">Entries added here appear in the Hall of Fame on the public website. Deleting an entry moves it to the Recycle Bin.</div></div><div class="panel"><div class="itemhead"><h2>Hall of Fame Records</h2><span class="pill" id="hallCount">0 entries</span></div><div id="hallList"></div></div>`}

function displayHTML(){return `<div class=\"panel\"><h2>Public Participant Names</h2><p class=\"muted\">Choose which username visitors see on the public website. This changes the leaderboard, team member lists, and published MVP name.</p><div class=\"maintenance-toggle-row\"><div><b>Show Discord usernames</b><small>When enabled, use Discord usernames instead of Roblox usernames where available.</small></div><label class=\"switch\"><input type=\"checkbox\" id=\"displayDiscordNames\"><span class=\"switch-track\"></span></label></div><div class=\"notice\">If a participant has no Discord username saved, their Roblox username will be shown instead.</div><div class=\"toolbar\">${btn('saveDisplayNames','Save display setting','primary')}</div><div id=\"displayNamesStatus\" class=\"muted\"></div></div>`}function maintenanceHTML(){return `<div class="maintenance-wrap"><div class="maintenance-hero"><div class="maintenance-orb">✦</div><div><div class="maintenance-kicker">SITE CONTROL</div><h2>Maintenance Mode</h2><p>Temporarily close the public event site while keeping staff tools available.</p></div><span id="maintenanceStatePill" class="maintenance-pill">${state?.settings?.maintenanceMode?'LIVE · MAINTENANCE':'PUBLIC SITE · LIVE'}</span></div><div class="maintenance-panel"><div class="maintenance-toggle-row"><div><b>Maintenance switch</b><small>Turn the public site on or off</small></div><label class="switch"><input type="checkbox" id="maintenanceEnabled"><span class="switch-track"></span></label></div><label for="maintenanceMessage">Message shown to visitors</label><textarea id="maintenanceMessage" placeholder="The Nerolympics site is being updated. Please check back soon."></textarea><div class="maintenance-footer"><div id="maintenanceStatus" class="maintenance-status">Changes are saved when you press the button.</div>${btn('saveMaintenance','Save changes','primary')}</div></div><div class="maintenance-panel" style="margin-top:14px"><h3 style="margin-top:0">Event Countdown</h3><p class="muted">Change the public countdown date and start time if the event is delayed. The public countdown updates automatically.</p><label for="countdownDateTime">New event date and time (your local time)</label><input type="datetime-local" id="countdownDateTime"><div class="maintenance-footer"><div id="countdownStatus" class="maintenance-status">Current date: ${state?.settings?.eventStartAt ? new Date(state.settings.eventStartAt).toLocaleString() : 'November 14, 2026, 6:00 PM EST'}</div>${btn('saveCountdown','Save countdown','primary')}</div></div><div class="maintenance-tip">✦ Staff access remains available while maintenance mode is enabled.</div></div>`}
function date(v){if(!v)return 'Not scheduled';const d=new Date(v);return Number.isNaN(d.getTime())?'Not scheduled':d.toLocaleString();}
function options(items,label,selected=''){return items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(label(x))}</option>`).join('');}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="12" class="empty">No records found.</td></tr>'}</tbody></table></div>`}
function renderData(){const players=state.players,teams=state.teams;const playerRows=players.map(p=>`<tr><td><input class="checkbox playerCheck" type="checkbox" value="${esc(p.id)}"></td><td><b>${esc(p.roblox)}</b></td><td>${esc(p.discord||'—')}</td><td><span class="pill">${esc(p.status)}</span></td><td>${money(p.points)}</td><td>${esc(teams.find(t=>t.id===p.teamId)?.name||'—')}</td><td><button class="small secondary" data-edit-player="${esc(p.id)}">Edit</button> <button class="small danger" data-delete-player="${esc(p.id)}">Delete</button></td></tr>`).join('');$('playerTable').innerHTML=table(['','PLAYER','DISCORD','STATUS','POINTS','TEAM','ACTIONS'],playerRows);$('teamList').innerHTML=teams.map(t=>{const memberIds=t.memberIds||[];const members=memberIds.map(pid=>{const player=players.find(p=>p.id===pid);return player?`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid #263449"><span>${esc(player.roblox)}</span><button type="button" class="small danger" data-team-remove="${esc(t.id)}" data-player-id="${esc(player.id)}">Remove</button></div>`:''}).join('');const available=players.filter(p=>p.teamId!==t.id);return `<div class="item"><label><input class="checkbox teamCheck" type="checkbox" value="${esc(t.id)}"> Select</label><div class="itemhead"><b>${esc(t.name)}</b><span class="pill">${memberIds.length} members · ${money(t.points)} pts · ${t.wins||0} wins</span></div><div class="team-members">${members||'<p class="muted">No members</p>'}</div><div class="row" style="margin-top:10px"><select id="addMember-${esc(t.id)}"><option value="">Choose participant to add or move</option>${options(available,p=>p.roblox)}</select><button type="button" class="small primary" data-team-add="${esc(t.id)}">Add participant</button></div><div class="toolbar"><button type="button" class="small secondary" data-edit-team="${esc(t.id)}">Edit team</button></div></div>`}).join('')||'<p class="empty">No teams created.</p>';
$('eventList').innerHTML=state.events.map(e=>`<div class="item"><div class="itemhead"><b>${esc(e.title)}</b><span class="pill">${esc(e.status)}</span></div><p class="muted">${date(e.startAt)} · ${e.published?'Public':'Hidden'}</p><p>${esc(e.description||'')}</p><div class="toolbar"><button class="small secondary" data-edit-event="${esc(e.id)}">Edit</button><button class="small danger" data-delete-event="${esc(e.id)}">Delete</button></div></div>`).join('')||'<p class="empty">No events yet.</p>';

$('announcementList').innerHTML=state.announcements.map(a=>`<div class="item"><label><input class="checkbox announcementCheck" type="checkbox" value="${esc(a.id)}"> Select</label><div class="itemhead"><b>${esc(a.title)}</b><span class="pill">${a.published?'Published':'Draft'}</span></div><p>${esc(a.body)}</p><div class="toolbar"><button class="small secondary" data-toggle-announcement="${esc(a.id)}">${a.published?'Unpublish':'Publish'}</button><button class="small danger" data-delete-announcement="${esc(a.id)}">Delete</button></div></div>`).join('')||'<p class="empty">No announcements.</p>';
$('prizeList').innerHTML=state.prizes.map(p=>`<div class="item"><label><input class="checkbox prizeCheck" type="checkbox" value="${esc(p.id)}"> Select</label><div class="itemhead"><b>${esc(p.playerName)}</b><span class="pill">${p.delivered?'Delivered':'Pending'}</span></div><p>${esc(p.reward)} · ${p.public?'Public':'Private'}</p><div class="toolbar"><button class="small secondary" data-toggle-prize="${esc(p.id)}">Toggle delivered</button><button class="small danger" data-delete-prize="${esc(p.id)}">Delete</button></div></div>`).join('')||'<p class="empty">No prizes recorded.</p>';
const hallEntries=Array.isArray(state.hallOfFame)?state.hallOfFame:[];const canEditHall=role==='admin'||state.settings.staffPermissions?.addHallOfFame===true;const canUpdateHall=role==='admin'||state.settings.staffPermissions?.updateHallOfFame===true;const canDeleteHall=role==='admin'||state.settings.staffPermissions?.deleteHallOfFame===true;$('hallCount').textContent=`${hallEntries.length} entries`;$('hallList').innerHTML=hallEntries.map(h=>`<div class="item"><div class="itemhead"><b>${esc(h.teamName||'Hall of Fame Entry')}</b><span class="pill">${date(h.publishedAt)}</span></div><p>${esc(h.message||'')}</p><div class="toolbar">${canUpdateHall?`<button class="small secondary" data-edit-hall="${esc(h.id)}">Edit</button>`:''}${canDeleteHall?`<button class="small danger" data-delete-hall="${esc(h.id)}">Delete</button>`:''}</div></div>`).join('')||'<p class="empty">No Hall of Fame entries yet.</p>';$('addHallEntry').disabled=!canEditHall;
$('recycleList').innerHTML=state.recycleBin.map(x=>`<div class="item"><label><input class="checkbox recycleCheck" type="checkbox" value="${esc(x.id)}"> Select</label><div class="itemhead"><b>${esc(x.record.roblox||x.record.name||x.record.title||x.type)}</b><span class="pill">${esc(x.type)}</span></div><small>Deleted ${date(x.deletedAt)}</small><div class="toolbar"><button class="small" data-restore="${esc(x.id)}">Restore</button>${role==='admin'?`<button class="small danger" data-permanent="${esc(x.id)}">Delete permanently</button>`:''}</div></div>`).join('')||'<p class="empty">Recycle Bin is empty.</p>';
$('versionList').innerHTML=role==='admin'?state.versions.map(v=>`<div class="item"><b>${esc(v.summary)}</b><p class="muted">${date(v.createdAt)}</p><div class="toolbar"><button class="small secondary" data-preview-version="${esc(v.id)}">Preview</button><button class="small danger" data-restore-version="${esc(v.id)}">Restore this version</button></div></div>`).join('')||'<p class="empty">No versions yet.</p>':'<p class="empty">Version history is admin-only.</p>';
$('activityList').innerHTML=state.activityLog.map(a=>`<div class="item"><div class="itemhead"><b>${esc(a.summary)}</b><span class="pill">${esc(a.actor?.role||'Staff')}</span></div><p class="muted"><strong>${esc(a.actor?.name||'Previously recorded activity')}</strong> · ${date(a.timestamp)}</p></div>`).join('')||'<p class="empty">No activity yet.</p>';
fillAllSelects();renderPermissions();renderAnalytics();const displayToggle=$('displayDiscordNames');if(displayToggle){displayToggle.checked=!!state.settings.displayDiscordNames;displayToggle.disabled=role!=='admin';$('saveDisplayNames').disabled=role!=='admin';$('displayNamesStatus').textContent=role==='admin'?(displayToggle.checked?'Public names currently prefer Discord usernames.':'Public names currently use Roblox usernames.'):'Only Chancellor and above can change public name display.';}$('mvpStatus').textContent=state.settings.mvp?.playerId?`Selected: ${players.find(p=>p.id===state.settings.mvp.playerId)?.roblox||'Unknown'} · ${state.settings.mvp.published?'Published':'Not published'}`:'No MVP selected.';const canManageMaintenance=role==='admin'||state.settings.staffPermissions?.setMaintenance===true;$('maintenanceEnabled').checked=!!state.settings.maintenanceMode;$('maintenanceMessage').value=state.settings.maintenanceMessage||'';$('maintenanceEnabled').disabled=!canManageMaintenance;$('maintenanceMessage').disabled=!canManageMaintenance;$('saveMaintenance').disabled=!canManageMaintenance;$('maintenanceStatus').textContent=canManageMaintenance?(state.settings.maintenanceMode?'Maintenance mode is ON.':'Maintenance mode is OFF.'):'Your staff account does not have permission to edit maintenance mode.';$('maintenanceStatePill').textContent=state.settings.maintenanceMode?'MAINTENANCE · ON':'PUBLIC SITE · LIVE';const countdownDate=$('countdownDateTime');if(countdownDate){const current=new Date(state.settings.eventStartAt||'2026-11-14T23:00:00.000Z');countdownDate.value=new Date(current.getTime()-current.getTimezoneOffset()*60000).toISOString().slice(0,16);countdownDate.disabled=role!=='admin';$('saveCountdown').disabled=role!=='admin';}
}
function fillAllSelects(){const defs=[['eventMatch',state.events],['checkinEvent',state.events],['matchEvent',state.events],['pointsPlayer',state.players],['achievementPlayer',state.players],['completeChallengePlayer',state.players],['winnerTeam',state.teams],['mvpPlayer',state.players],['prizePlayer',state.players]];for(const [id,items]of defs){const el=$(id);if(el)el.innerHTML='<option value="">Select...</option>'+options(items,x=>x.roblox||x.name||x.title);}$('matchTeams').innerHTML=options(state.teams,t=>t.name);$('checkinTable').innerHTML=table(['','PARTICIPANT','STATUS','POINTS','INDIVIDUAL CHECK-IN'],state.players.map(p=>`<tr><td><input class="checkbox checkinCheck" type="checkbox" value="${esc(p.id)}"></td><td>${esc(p.roblox)}</td><td>${esc(p.status)}</td><td>${money(p.points)}</td><td><select id="singleCheckin-${esc(p.id)}"><option>Present</option><option>Absent</option><option>Late</option></select> <button class="small" data-single-checkin="${esc(p.id)}">Save</button></td></tr>`).join(''));}
function renderPermissions(){if(role!=='admin'){$('permissionList').innerHTML='<p class="empty">Only Chancellor and above can change permissions.</p>';return;}const labels={addPlayer:'Add participants',updatePlayer:'Edit participants',deletePlayer:'Delete participants',generateTeams:'Generate teams',publishTeams:'Publish teams',resetTeams:'Reset teams',updateTeam:'Edit teams',checkin:'Individual check-ins',bulkCheckin:'Bulk check-ins',addEvent:'Create events',updateEvent:'Edit events',deleteEvent:'Delete events',addMatch:'Create matches',updateMatch:'Edit matches',completeMatch:'Complete matches',deleteMatch:'Delete matches',awardPoints:'Award points',addAchievement:'Add achievements',addChallenge:'Create challenges',completeChallenge:'Complete challenges',deleteChallenge:'Delete challenges',addAnnouncement:'Create announcements',updateAnnouncement:'Edit announcements',deleteAnnouncement:'Delete announcements',selectMvp:'Select MVP',addPrize:'Add prizes',updatePrize:'Edit prizes',bulkPrizeDelivered:'Bulk prize delivery',bulkPlayerStatus:'Bulk participant status',bulkAwardPoints:'Bulk award points',bulkAssignTeam:'Bulk team assignment',bulkPublishAnnouncements:'Bulk publish announcements',restoreRecycleItem:'Restore Recycle Bin items',bulkRestoreRecycleItems:'Bulk restore Recycle Bin items',bulkDeleteTeams:'Bulk delete teams',publishWinner:'Publish winner',addHallOfFame:'Add Hall of Fame entries',updateHallOfFame:'Edit Hall of Fame entries',deleteHallOfFame:'Delete Hall of Fame entries',setMaintenance:'Manage maintenance mode'};const adminOnly=['clearWinner'];$('permissionList').innerHTML=Object.entries(state.settings.staffPermissions).map(([key,val])=>`<div class="permission"><span>${esc(labels[key]||key)} ${adminOnly.includes(key)?'<small>(Admin only)</small>':''}</span><input type="checkbox" class="permissionCheck" data-permission="${esc(key)}" ${val?'checked':''} ${adminOnly.includes(key)?'disabled':''}></div>`).join('');}
async function renderAnalytics(){try{const a=await api('/api/staff/analytics');$('analyticsData').innerHTML=[['PARTICIPANTS',a.participants],['ACTIVE',a.active],['PARTICIPATION RATE',a.participationRate+'%'],['TOTAL POINTS',money(a.totalPoints)],['MATCHES',a.matches],['COMPLETED',a.completedMatches]].map(([k,v])=>`<div class="card stat"><span>${k}</span><strong>${v}</strong></div>`).join('');$('teamAnalytics').innerHTML=table(['TEAM','PLAYERS','POINTS','WINS'],a.teamStats.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.players}</td><td>${money(t.points)}</td><td>${t.wins}</td></tr>`).join(''));}catch(e){$('analyticsData').textContent=e.message;}}
function showPage(id){active=id;closeNav();renderShell();renderData();}
async function loadState(){state=await api('/api/staff/state');$('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();renderShell();renderData();bindEvents();}
function modal(title,body,actions=[]){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML=actions.map((a,i)=>`<button data-modal-action="${i}" class="${a.cls||''}">${esc(a.label)}</button>`).join('');$('modal').classList.remove('hidden');$('modalActions').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>actions[i].run());}
function selected(cls){return [...document.querySelectorAll('.'+cls+':checked')].map(x=>x.value)}function previewBulk(title,items,run){if(!items.length)return toast('Select at least one record.');modal(title,`<p>You are about to affect <b>${items.length}</b> record(s):</p><ul>${items.slice(0,30).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${items.length>30?`<p>and ${items.length-30} more...</p>`:''}<p class="dangertext">Review this list before confirming.</p>`,[{label:'Cancel',cls:'secondary',run:()=>$('modal').classList.add('hidden')},{label:'Confirm action',cls:'danger',run:async()=>{ $('modal').classList.add('hidden');await run();}}]);}

$('awardPoints').onclick=()=>action('awardPoints',{playerId:$('pointsPlayer').value,amount:Number($('pointsAmount').value)});$('addAchievement').onclick=()=>action('addAchievement',{playerId:$('achievementPlayer').value,name:$('achievementName').value});$('addChallenge').onclick=()=>action('addChallenge',{title:$('challengeTitle').value,description:$('challengeDescription').value,points:Number($('challengePoints').value),achievement:$('challengeAchievement').value,published:$('challengePublished').checked});
$('addAnnouncement').onclick=()=>action('addAnnouncement',{title:$('announcementTitle').value,body:$('announcementBody').value,published:$('announcementPublished').checked});$('bulkPublishAnnouncements').onclick=()=>{const ids=selected('announcementCheck');previewBulk('Preview publishing announcements',ids.map(id=>state.announcements.find(a=>a.id===id)?.title||id),()=>action('bulkPublishAnnouncements',{ids,published:true}));};$('bulkUnpublishAnnouncements').onclick=()=>{const ids=selected('announcementCheck');previewBulk('Preview unpublishing announcements',ids.map(id=>state.announcements.find(a=>a.id===id)?.title||id),()=>action('bulkPublishAnnouncements',{ids,published:false}));};$('bulkDeleteAnnouncements').onclick=()=>{const ids=selected('announcementCheck');previewBulk('Preview announcement deletion',ids.map(id=>state.announcements.find(a=>a.id===id)?.title||id),()=>action('bulkDeleteAnnouncements',{ids}));};
$('addHallEntry').onclick=()=>{const teamName=$('hallName').value.trim(),message=$('hallMessage').value.trim(),dateValue=$('hallDate').value;if(!teamName)return toast('Enter a team or player name.');action('addHallOfFame',{teamName,message,publishedAt:dateValue?new Date(dateValue+'T12:00:00').toISOString():null});};
 $('publishWinner').onclick=()=>{if(role!=='admin')return toast('Chancellor access required.');action('publishWinner',{teamId:$('winnerTeam').value,message:$('winnerMessage').value});};$('clearWinner').onclick=()=>{if(role!=='admin')return toast('Chancellor access required.');action('clearWinner');};$('selectMvp').onclick=()=>action('selectMvp',{playerId:$('mvpPlayer').value,message:$('mvpMessage').value});$('publishMvp').onclick=()=>{if(role!=='admin')return toast('Chancellor access required.');action('publishMvp');};
$('addPrize').onclick=()=>action('addPrize',{playerId:$('prizePlayer').value,reward:$('prizeReward').value,public:$('prizePublic').checked});$('bulkPrizeDelivered').onclick=()=>{const ids=selected('prizeCheck');previewBulk('Preview prize delivery update',ids.map(id=>state.prizes.find(p=>p.id===id)?.playerName||id),()=>action('bulkPrizeDelivered',{ids,delivered:true}));};
$('reloadAnalytics').onclick=renderAnalytics;$('globalQuery').oninput=async()=>{const q=$('globalQuery').value.trim();if(q.length<2){$('searchResults').innerHTML='';return;}try{const rows=await api('/api/staff/search?q='+encodeURIComponent(q));$('searchResults').innerHTML=rows.map(x=>`<div class="item"><b>${esc(x.label)}</b> <span class="pill">${esc(x.type)}</span><small>${esc(x.detail||'')}</small></div>`).join('')||'<p class="empty">No results.</p>';}catch(e){$('searchResults').textContent=e.message;}};
$('bulkRestoreRecycle').onclick=()=>{const ids=selected('recycleCheck');previewBulk('Preview Recycle Bin restore',ids.map(id=>{const x=state.recycleBin.find(y=>y.id===id);return x?.record.roblox||x?.record.name||x?.record.title||x?.type||id;}),()=>action('bulkRestoreRecycleItems',{ids}));};
$('emptyRecycle').onclick=()=>{if(role!=='admin')return toast('Chancellor access required.');previewBulk('Permanently empty Recycle Bin',state.recycleBin.map(x=>x.record.roblox||x.record.name||x.record.title||x.type),()=>action('emptyRecycleBin'));};
$('undoLatest').onclick=()=>{if(role!=='admin')return toast('Chancellor access required.');modal('Undo latest change','This restores the previous saved version of the event data. A new snapshot is saved first.',[{label:'Cancel',cls:'secondary',run:()=>$('modal').classList.add('hidden')},{label:'Undo change',cls:'danger',run:async()=>{$('modal').classList.add('hidden');await action('undo');}}]);};$('exportBackup').onclick=async()=>{if(role!=='admin')return toast('Chancellor access required.');const data=await api('/api/staff/backup');const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nerolympics-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);};$('createBackup').onclick=async()=>{if(role!=='admin')return toast('Chancellor access required.');await api('/api/staff/action',{method:'POST',body:JSON.stringify({type:'createBackup',payload:{}})});toast('Backup created.');};$('importBackup').onclick=async()=>{if(role!=='admin')return toast('Chancellor access required.');const file=$('backupFile').files[0];if(!file)return toast('Choose a backup file first.');let backup;try{backup=JSON.parse(await file.text());}catch{return toast('The selected file is not valid JSON.');}modal('Confirm backup restore','The backup will replace the current event records. A snapshot of the current data will be saved first.',[{label:'Cancel',cls:'secondary',run:()=>$('modal').classList.add('hidden')},{label:'Validate & restore',cls:'danger',run:async()=>{$('modal').classList.add('hidden');await api('/api/staff/action',{method:'POST',body:JSON.stringify({type:'importBackup',payload:{backup}})});await loadState();toast('Backup restored.');}}]);};
$('savePermissions').onclick=()=>{if(role!=='admin')return toast('Chancellor access required.');const permissions={};document.querySelectorAll('.permissionCheck').forEach(x=>permissions[x.dataset.permission]=x.checked);action('updatePermissions',{permissions});};$('resetPermissions').onclick=()=>{if(role!=='admin')return toast('Chancellor access required.');action('updatePermissions',{permissions:Object.fromEntries(Object.keys(state.settings.staffPermissions).map(k=>[k,!['deletePlayer','resetTeams','deleteEvent','deleteMatch','deleteChallenge','deleteAnnouncement','deletePrize','bulkDeletePlayers','bulkDeleteAnnouncements','bulkDeleteTeams','publishWinner','addHallOfFame','updateHallOfFame','deleteHallOfFame'].includes(k)]))});};$('saveMaintenance').onclick=async()=>{const button=$('saveMaintenance'),status=$('maintenanceStatus');if(button.disabled)return;const enabled=$('maintenanceEnabled').checked,message=$('maintenanceMessage').value;button.disabled=true;button.textContent='Saving…';status.className='maintenance-status';status.textContent='Saving maintenance settings…';try{await api('/api/staff/action',{method:'POST',body:JSON.stringify({type:'setMaintenance',payload:{enabled,message}})});state.settings.maintenanceMode=enabled;state.settings.maintenanceMessage=message;$('maintenanceStatePill').textContent=enabled?'MAINTENANCE · ON':'PUBLIC SITE · LIVE';status.className='maintenance-status success';status.textContent=enabled?'Maintenance mode is ON. The public site is now showing your message.':'Maintenance mode is OFF. The public site is live again.';toast('Maintenance settings saved.');}catch(err){status.className='maintenance-status error';status.textContent=err.message||'Could not save. Please try again.';}finally{button.disabled=!(role==='admin'||state.settings.staffPermissions?.setMaintenance===true);button.textContent='Save changes';}};
$('saveDisplayNames').onclick=async()=>{if(role!=='admin')return toast('Chancellor access required.');const enabled=$('displayDiscordNames').checked;const result=await action('setPublicNameMode',{enabled});if(result!==false)$('displayNamesStatus').textContent=enabled?'Public website will show Discord usernames when available.':'Public website will show Roblox usernames.';};
$('saveCountdown').onclick=async()=>{if(role!=='admin')return toast('Chancellor access required.');const value=$('countdownDateTime').value;if(!value)return toast('Choose the new event date and time.');const iso=new Date(value).toISOString();const result=await action('setCountdown',{eventStartAt:iso});if(result!==false){$('countdownStatus').textContent='Countdown updated to '+new Date(iso).toLocaleString();toast('Countdown date saved.');}};
$('quickRefresh').onclick=loadState;$('quickUndo').onclick=()=>$('undoLatest').click();$('quickSearch').onclick=()=>showPage('search');$('playerFilter').oninput=()=>{const q=$('playerFilter').value.toLowerCase();document.querySelectorAll('#playerTable tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none');};
}
document.addEventListener('click',async e=>{const t=e.target instanceof Element?(e.target.closest('button,[data-edit-player],[data-delete-player],[data-edit-team],[data-team-add],[data-team-remove],[data-edit-event],[data-delete-event],[data-single-checkin],[data-complete-match],[data-delete-match],[data-complete-challenge],[data-delete-challenge],[data-toggle-announcement],[data-delete-announcement],[data-toggle-prize],[data-delete-prize],[data-restore],[data-permanent],[data-preview-version],[data-restore-version],[data-edit-hall],[data-delete-hall]')||e.target):e.target;try{
if(t.dataset.editPlayer){const p=state.players.find(x=>x.id===t.dataset.editPlayer);modal('Edit participant',`<label>Roblox username</label><input id="editRoblox" value="${esc(p.roblox)}"><label>Discord username</label><input id="editDiscord" value="${esc(p.discord)}"><label>Status</label><input id="editStatus" value="${esc(p.status)}"><label>Points</label><input id="editPoints" type="number" value="${Number(p.points||0)}">`,[{label:'Cancel',cls:'secondary',run:()=>$('modal').classList.add('hidden')},{label:'Save changes',run:async()=>{$('modal').classList.add('hidden');await action('updatePlayer',{id:p.id,roblox:$('editRoblox').value,discord:$('editDiscord').value,status:$('editStatus').value,points:Number($('editPoints').value)});}}]);}
if(t.dataset.deletePlayer){const p=state.players.find(x=>x.id===t.dataset.deletePlayer);previewBulk('Delete participant',[p.roblox],()=>action('deletePlayer',{id:p.id}));}
if(t.dataset.teamAdd){const teamId=t.dataset.teamAdd,playerId=$('addMember-'+teamId)?.value;if(!playerId)return toast('Choose a participant first.');await action('bulkAssignTeam',{playerIds:[playerId],teamId});}
if(t.dataset.teamRemove){await action('bulkAssignTeam',{playerIds:[t.dataset.playerId],teamId:null});}
if(t.dataset.editTeam){const team=state.teams.find(x=>x.id===t.dataset.editTeam);modal('Edit team',`<label>Team name</label><input id="editTeamName" value="${esc(team.name)}"><label>Captain</label><input id="editCaptain" value="${esc(team.captain||'')}"><p class="muted">Use the participant bulk assignment tool to change team membership.</p>`,[{label:'Cancel',cls:'secondary',run:()=>$('modal').classList.add('hidden')},{label:'Save',run:async()=>{$('modal').classList.add('hidden');await action('updateTeam',{id:team.id,name:$('editTeamName').value,captain:$('editCaptain').value});}}]);}
if(t.dataset.editEvent){const item=state.events.find(x=>x.id===t.dataset.editEvent);modal('Edit event',`<label>Title</label><input id="editTitle" value="${esc(item.title)}"><label>Description</label><textarea id="editDescription">${esc(item.description)}</textarea><label>Status</label><select id="editStatus"><option ${item.status==='Upcoming'?'selected':''}>Upcoming</option><option ${item.status==='Happening Now'?'selected':''}>Happening Now</option><option ${item.status==='Completed'?'selected':''}>Completed</option></select><label><input type="checkbox" id="editPublished" ${item.published?'checked':''}> Published</label>`,[{label:'Cancel',cls:'secondary',run:()=>$('modal').classList.add('hidden')},{label:'Save',run:async()=>{$('modal').classList.add('hidden');await action('updateEvent',{id:item.id,title:$('editTitle').value,description:$('editDescription').value,status:$('editStatus').value,published:$('editPublished').checked});}}]);}
if(t.dataset.deleteEvent){const item=state.events.find(x=>x.id===t.dataset.deleteEvent);previewBulk('Delete event',[item.title],()=>action('deleteEvent',{id:item.id}));}
if(t.dataset.singleCheckin){await action('checkin',{playerId:t.dataset.singleCheckin,eventId:$('checkinEvent').value,status:$('singleCheckin-'+t.dataset.singleCheckin).value});}
if(t.dataset.completeMatch){const m=state.matches.find(x=>x.id===t.dataset.completeMatch);await action('completeMatch',{matchId:m.id,winnerTeamId:$('matchWinner-'+m.id).value||null,awardPoints:true});}
if(t.dataset.deleteMatch){const m=state.matches.find(x=>x.id===t.dataset.deleteMatch);previewBulk('Delete match',[m.title],()=>action('deleteMatch',{id:m.id}));}
if(t.dataset.completeChallenge){const id=t.dataset.completeChallenge;await action('completeChallenge',{challengeId:id,playerId:$('challengePlayer-'+id).value});}
if(t.dataset.deleteChallenge){const c=state.challenges.find(x=>x.id===t.dataset.deleteChallenge);previewBulk('Delete challenge',[c.title],()=>action('deleteChallenge',{id:c.id}));}
if(t.dataset.toggleAnnouncement){const a=state.announcements.find(x=>x.id===t.dataset.toggleAnnouncement);await action('updateAnnouncement',{id:a.id,published:!a.published});}
if(t.dataset.deleteAnnouncement){const a=state.announcements.find(x=>x.id===t.dataset.deleteAnnouncement);previewBulk('Delete announcement',[a.title],()=>action('deleteAnnouncement',{id:a.id}));}
if(t.dataset.togglePrize){const p=state.prizes.find(x=>x.id===t.dataset.togglePrize);await action('updatePrize',{id:p.id,delivered:!p.delivered});}
if(t.dataset.deletePrize){const p=state.prizes.find(x=>x.id===t.dataset.deletePrize);previewBulk('Delete prize',[`${p.playerName}: ${p.reward}`],()=>action('deletePrize',{id:p.id}));}
if(t.dataset.editHall){const h=(state.hallOfFame||[]).find(x=>x.id===t.dataset.editHall);if(h){const dateValue=h.publishedAt&&!Number.isNaN(new Date(h.publishedAt).getTime())?new Date(h.publishedAt).toISOString().slice(0,10):'';modal('Edit Hall of Fame entry',`<label>Team or player name</label><input id="editHallName" value="${esc(h.teamName||'')}"><label>Achievement / description</label><textarea id="editHallMessage">${esc(h.message||'')}</textarea><label>Date</label><input id="editHallDate" type="date" value="${dateValue}">`,[{label:'Cancel',cls:'secondary',run:()=>$('modal').classList.add('hidden')},{label:'Save changes',run:async()=>{$('modal').classList.add('hidden');const d=$('editHallDate').value;await action('updateHallOfFame',{id:h.id,teamName:$('editHallName').value,message:$('editHallMessage').value,publishedAt:d?new Date(d+'T12:00:00').toISOString():null});}}]);}}
if(t.dataset.deleteHall){const h=(state.hallOfFame||[]).find(x=>x.id===t.dataset.deleteHall);if(h)previewBulk('Delete Hall of Fame entry',[h.teamName||'Hall of Fame entry'],()=>action('deleteHallOfFame',{id:h.id}));}
if(t.dataset.restore){const item=state.recycleBin.find(x=>x.id===t.dataset.restore);previewBulk('Restore deleted record',[item.record.roblox||item.record.name||item.record.title||item.type],()=>action('restoreRecycleItem',{id:item.id}));}
if(t.dataset.permanent){if(role!=='admin')return toast('Chancellor access required.');const item=state.recycleBin.find(x=>x.id===t.dataset.permanent);previewBulk('Permanently delete record',[item.record.roblox||item.record.name||item.record.title||item.type],()=>action('permanentDeleteRecycleItem',{id:item.id}));}
if(t.dataset.previewVersion){const v=state.versions.find(x=>x.id===t.dataset.previewVersion);modal('Version preview',`<p><b>${esc(v.summary)}</b></p><p>${date(v.createdAt)}</p><pre>${esc(JSON.stringify({participants:v.snapshot.players?.length,teams:v.snapshot.teams?.length,events:v.snapshot.events?.length,matches:v.snapshot.matches?.length,announcements:v.snapshot.announcements?.length,prizes:v.snapshot.prizes?.length},null,2))}</pre>` ,[{label:'Close',cls:'secondary',run:()=>$('modal').classList.add('hidden')}]);}
if(t.dataset.restoreVersion){if(role!=='admin')return toast('Chancellor access required.');const v=state.versions.find(x=>x.id===t.dataset.restoreVersion);modal('Restore version',`Restore the saved state from ${date(v.createdAt)}? A snapshot of the current state will be created first.`,[{label:'Cancel',cls:'secondary',run:()=>$('modal').classList.add('hidden')},{label:'Restore',cls:'danger',run:async()=>{$('modal').classList.add('hidden');await api('/api/staff/action',{method:'POST',body:JSON.stringify({type:'restoreVersion',payload:{versionId:v.id}})});await loadState();toast('Version restored.');}}]);}
}catch(err){toast(err.message);}});
$('modalClose').onclick=()=>$('modal').classList.add('hidden');$('refreshButton').onclick=loadState;$('logoutButton').onclick=async()=>{await api('/api/staff/logout',{method:'POST',body:'{}'});location.reload();};
document.addEventListener('pointerdown',e=>{const b=e.target instanceof Element?e.target.closest('button'):null;if(b&&document.activeElement!==b){try{b.focus({preventScroll:true})}catch{}}},{passive:true});
$('menuToggle').onclick=()=>{const open=document.body.classList.toggle('menu-open');$('menuToggle').setAttribute('aria-expanded',String(open));$('menuToggle').setAttribute('aria-label',open?'Close navigation':'Open navigation');};$('navScrim').onclick=closeNav;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});$('discordLoginButton').onclick=()=>{location.href='/auth/discord';};
(async()=>{try{const s=await api('/api/staff/me');if(s.authenticated){role=s.role;displayName=s.displayName||s.discordUsername||'Discord User';$('loginScreen').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadState();bindEvents();}}catch{}})();
</script></body></html>
